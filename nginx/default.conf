limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_atlas_auth {
        internal;
        proxy_pass http://api:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Atlas-API-Key $http_x_atlas_api_key;
    }

    location = /api/auth/session {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    location = /api {
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_pass http://api:8000;
    }

    location = /sandbox-api {
        proxy_pass http://sandbox:8100/api;
    }

    location /sandbox-api/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_pass http://sandbox:8100/api/;
    }

    location /sandbox-vnc/ {
        auth_request /_atlas_auth;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://sandbox:6080/;
    }

    location /uploads/ {
        auth_request /_atlas_auth;
        alias /var/www/uploads/;
        add_header Cache-Control "private, max-age=3600";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ui:3000;
    }
}
