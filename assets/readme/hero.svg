          <circle cx="20" cy="19" r="5" fill="#27c878"/>
          <text x="34" y="25" fill="#b5b7bd">EVIDENCE MEMORY</text>

          <rect x="202" width="170" height="38" rx="6" fill="#111215" stroke="#343840"/>
          <circle cx="222" cy="19" r="5" fill="#3478f6"/>
          <text x="236" y="25" fill="#b5b7bd">CHECKPOINT DAG</text>

          <rect x="384" width="174" height="38" rx="6" fill="#111215" stroke="#343840"/>
          <circle cx="404" cy="19" r="5" fill="#a978ff"/>
