<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AtlasAgent — AI Agent Control Plane</title>
  <desc id="desc">AtlasAgent turns agent tasks into a traceable timeline of evidence-backed memory, permissioned tool calls, artifacts, and validated checkpoints.</desc>

  <defs>
    <linearGradient id="blue-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3478f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3478f6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
