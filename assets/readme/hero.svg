        <text x="0" y="96" fill="#f3f4f6" font-size="70" font-weight="720" letter-spacing="-3">AtlasAgent</text>
        <text x="2" y="143" fill="#f3f4f6" font-size="27" font-weight="650">Trace what agents know, do, and recover.</text>
        <text x="2" y="181" fill="#747780" font-size="20">Evidence-backed memory · permissioned tools · valid checkpoints</text>

