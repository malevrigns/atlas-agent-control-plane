sservices:
  nginx:
    image: nginx:1.27-alpine
    container_name: atlas-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - api_uploads:/var/www/uploads:ro
    networks:
      - atlas-network
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./ui
      args:
        API_PROXY_URL: ${UI_API_PROXY_URL:-http://api:8000/api/:path*}
    container_name: atlas-ui
    restart: unless-stopped
    environment:
      API_PROXY_URL: ${UI_API_PROXY_URL:-http://api:8000/api/:path*}
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "3000"
    networks:
      - atlas-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
    container_name: atlas-api
    restart: unless-stopped
    environment:
      API_APP_NAME: ${API_APP_NAME:-AtlasAgent API}
      API_ENV: ${API_ENV:-development}
      API_VERSION: ${API_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LLM_CONFIG_PATH: ${LLM_CONFIG_PATH:-runtime-config/llm.yaml}
      MCP_CONFIG_PATH: ${MCP_CONFIG_PATH:-runtime-config/mcp.yaml}
      A2A_CONFIG_PATH: ${A2A_CONFIG_PATH:-runtime-config/a2a.yaml}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/atlas_agents}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_TASK_STREAM: ${AGENT_TASK_STREAM:-agent:tasks}
      AGENT_TASK_POLL_TIMEOUT_MS: ${AGENT_TASK_POLL_TIMEOUT_MS:-1000}
      CONTEXT_MESSAGE_LIMIT: ${CONTEXT_MESSAGE_LIMIT:-8}
      CONTEXT_EVENT_LIMIT: ${CONTEXT_EVENT_LIMIT:-20}
      CONTEXT_MAX_MESSAGE_CHARS: ${CONTEXT_MAX_MESSAGE_CHARS:-1200}
      CONTEXT_MEMORY_CANDIDATE_LIMIT: ${CONTEXT_MEMORY_CANDIDATE_LIMIT:-100}
      CONTEXT_MEMORY_LIMIT: ${CONTEXT_MEMORY_LIMIT:-6}
      CONTEXT_MEMORY_MAX_CHARS: ${CONTEXT_MEMORY_MAX_CHARS:-2400}
      CONTEXT_MEMORY_ITEM_MAX_CHARS: ${CONTEXT_MEMORY_ITEM_MAX_CHARS:-500}
      CONTEXT_MEMORY_MIN_SCORE: ${CONTEXT_MEMORY_MIN_SCORE:-0.12}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["http://localhost:8088","http://127.0.0.1:8088","http://localhost:3000","http://127.0.0.1:3000"]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-["*"]}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-["*"]}
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/app/artifacts}
      TOOL_OUTPUT_INLINE_LIMIT: ${TOOL_OUTPUT_INLINE_LIMIT:-65536}
      TOOL_DEFAULT_TIMEOUT_SECONDS: ${TOOL_DEFAULT_TIMEOUT_SECONDS:-30}
      TOOL_AUTO_APPROVE_RISK: ${TOOL_AUTO_APPROVE_RISK:-medium}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      MAX_FILE_PREVIEW_SIZE: ${MAX_FILE_PREVIEW_SIZE:-65536}
      SANDBOX_API_BASE_URL: ${SANDBOX_API_BASE_URL:-http://sandbox:8100/api}
      SANDBOX_API_TIMEOUT_SECONDS: ${SANDBOX_API_TIMEOUT_SECONDS:-30}
      SANDBOX_SHELL_WAIT_TIMEOUT_SECONDS: ${SANDBOX_SHELL_WAIT_TIMEOUT_SECONDS:-10}
      DOCKER_SANDBOX_ID: ${DOCKER_SANDBOX_ID:-default}
      DOCKER_SANDBOX_NAME: ${DOCKER_SANDBOX_NAME:-atlas-sandbox}
      DOCKER_SANDBOX_WAIT_RETRIES: ${DOCKER_SANDBOX_WAIT_RETRIES:-10}
      DOCKER_SANDBOX_WAIT_INTERVAL_SECONDS: ${DOCKER_SANDBOX_WAIT_INTERVAL_SECONDS:-1}
      BING_SEARCH_API_KEY: ${BING_SEARCH_API_KEY:-}
      BING_SEARCH_ENDPOINT: ${BING_SEARCH_ENDPOINT:-https://api.bing.microsoft.com}
      BING_SEARCH_MARKET: ${BING_SEARCH_MARKET:-zh-CN}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-10}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
    volumes:
      - api_uploads:/app/uploads
      - api_artifacts:/app/artifacts
      - api_runtime_config:/app/runtime-config
    expose:
      - "8000"
    networks:
      - atlas-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sandbox:
    build:
      context: ./sandbox
    container_name: atlas-sandbox
    restart: unless-stopped
    environment:
      SANDBOX_APP_NAME: ${SANDBOX_APP_NAME:-AtlasAgent Sandbox}
      SANDBOX_ENV: ${SANDBOX_ENV:-development}
      SANDBOX_VERSION: ${SANDBOX_VERSION:-0.1.0}
      SANDBOX_API_PREFIX: ${SANDBOX_API_PREFIX:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKSPACE_DIR: ${SANDBOX_WORKSPACE_DIR:-/workspace}
      MAX_FILE_READ_BYTES: ${SANDBOX_MAX_FILE_READ_BYTES:-65536}
      MAX_FILE_WRITE_BYTES: ${SANDBOX_MAX_FILE_WRITE_BYTES:-524288}
      MAX_UPLOAD_SIZE: ${SANDBOX_MAX_UPLOAD_SIZE:-10485760}
      SHELL_OUTPUT_LIMIT: ${SANDBOX_SHELL_OUTPUT_LIMIT:-65536}
      SHELL_DEFAULT_TIMEOUT_SECONDS: ${SANDBOX_SHELL_DEFAULT_TIMEOUT_SECONDS:-10}
      BROWSER_ENABLED: ${SANDBOX_BROWSER_ENABLED:-true}
      BROWSER_HEADLESS: ${SANDBOX_BROWSER_HEADLESS:-false}
      BROWSER_VIEWPORT_WIDTH: ${SANDBOX_BROWSER_VIEWPORT_WIDTH:-1280}
      BROWSER_VIEWPORT_HEIGHT: ${SANDBOX_BROWSER_VIEWPORT_HEIGHT:-720}
      BROWSER_DEFAULT_TIMEOUT_MS: ${SANDBOX_BROWSER_DEFAULT_TIMEOUT_MS:-15000}
      BROWSER_SCREENSHOT_FULL_PAGE: ${SANDBOX_BROWSER_SCREENSHOT_FULL_PAGE:-true}
      VNC_ENABLED: ${SANDBOX_VNC_ENABLED:-true}
      VNC_DISPLAY: ${SANDBOX_VNC_DISPLAY:-:99}
      VNC_PORT: ${SANDBOX_VNC_PORT:-5900}
      VNC_WEB_PORT: ${SANDBOX_VNC_WEB_PORT:-6080}
      VNC_IFRAME_PATH: ${SANDBOX_VNC_IFRAME_PATH:-}
      DISPLAY: ${SANDBOX_VNC_DISPLAY:-:99}
      SUPERVISOR_ENABLED: ${SUPERVISOR_ENABLED:-false}
      SUPERVISOR_SERVICES: ${SUPERVISOR_SERVICES:-["sandbox-api","xvfb","x11vnc","websockify"]}
    volumes:
      - sandbox_workspace:/workspace
    expose:
      - "8100"
      - "5900"
      - "6080"
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/status').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas_agents}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - atlas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_uploads:
  api_artifacts:
  api_runtime_config:
  sandbox_workspace:
  postgres_data:
  redis_data:

networks:
  atlas-network:
    name: atlas-network
    driver: bridge
