[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agent-tui"
version = "0.2.0"
description = "Keyboard-first terminal client for AtlasAgent."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "textual>=1.0,<7.0",
]

[project.scripts]
atlas-tui = "atlas_agent_tui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_agent_tui*"]
